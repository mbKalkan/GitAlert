name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Windows builds the whole solution, WPF project included. The other two cannot build WPF,
      # so they build the Avalonia app and both test projects, which pull the core and the Windows
      # layer's portable parts in behind them.
      - name: Restore
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dotnet restore GitAlert.sln
          else
            dotnet restore src/GitAlert.Desktop/GitAlert.Desktop.csproj
            dotnet restore tests/GitAlert.Tests/GitAlert.Tests.csproj
            dotnet restore tests/GitAlert.Desktop.Tests/GitAlert.Desktop.Tests.csproj
          fi

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dotnet build GitAlert.sln -c Release --no-restore
          else
            dotnet build src/GitAlert.Desktop/GitAlert.Desktop.csproj -c Release --no-restore
            dotnet build tests/GitAlert.Tests/GitAlert.Tests.csproj -c Release --no-restore
            dotnet build tests/GitAlert.Desktop.Tests/GitAlert.Desktop.Tests.csproj -c Release --no-restore
          fi

      - name: Test
        shell: bash
        run: |
          dotnet test tests/GitAlert.Tests/GitAlert.Tests.csproj -c Release --no-build
          dotnet test tests/GitAlert.Desktop.Tests/GitAlert.Desktop.Tests.csproj -c Release --no-build

      # A quick smoke check that the app starts, renders its vector artwork and exits cleanly.
      # --export-icon exercises WPF rendering without needing an interactive desktop session.
      - name: Smoke test the icon pipeline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/GitAlert/GitAlert.csproj -c Release -r win-x64 --self-contained false -o artifacts/smoke
          $icon = Join-Path (Resolve-Path artifacts/smoke) 'app.ico'
          $run = Start-Process -FilePath ./artifacts/smoke/GitAlert.exe -ArgumentList '--export-icon', $icon -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "GitAlert exited with $($run.ExitCode)." }
          if (-not (Test-Path $icon)) { throw "The icon was not generated." }
          Write-Host "Icon rendered: $((Get-Item $icon).Length) bytes"

      # The same check for the Avalonia binary on the other two: it publishes for the machine it is
      # on, starts without a display and draws the icon files the packages are built from.
      - name: Smoke test the icon pipeline (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dotnet publish src/GitAlert.Desktop/GitAlert.Desktop.csproj -c Release --self-contained true -p:DebugType=none -o artifacts/smoke
          ./artifacts/smoke/GitAlert --export-png artifacts/smoke/pngs
          test -s artifacts/smoke/pngs/gitalert-1024.png
          ls -l artifacts/smoke/pngs

  # The branch rule on main waits for one check called "Build and test". The matrix legs each carry
  # their own name, so this job wears the required one and turns green only when every leg did.
  verdict:
    name: Build and test
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every platform to pass
        shell: bash
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "The platform matrix finished with '$RESULT'."
          test "$RESULT" = "success"
