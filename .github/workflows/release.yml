name: Release

# Tag a commit to cut a release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Three build jobs, one per operating system, publish a self-contained build and package it the way
# that platform expects; the last job gathers every package into one GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (for example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # The tag name and the dispatch input reach the script through the environment rather than
      # by expression substitution. Substituting them would paste text somebody else chose
      # straight into the shell, and a tag name is allowed to contain quotes.
      - name: Resolve the version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version like 1.0.0, got '$version'." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building GitAlert $version"

  windows:
    name: Windows installer and portable archive
    needs: version
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # Pinned like the actions above: a release build should not pick up whatever the package
      # feed happens to hold that day. Dependabot does not watch this one, so bump it by hand.
      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y
        shell: pwsh

      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Version ${{ needs.version.outputs.version }} -Installer -Zip

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem artifacts -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            artifacts/GitAlert-Setup-*.exe
            artifacts/GitAlert-*-portable.zip

  macos:
    name: macOS app bundles
    needs: version
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Test
        shell: bash
        run: |
          dotnet test tests/GitAlert.Tests/GitAlert.Tests.csproj -c Release
          dotnet test tests/GitAlert.Desktop.Tests/GitAlert.Desktop.Tests.csproj -c Release

      - name: Publish for both architectures
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/GitAlert.Desktop/GitAlert.Desktop.csproj -c Release -r "$rid" --self-contained true \
              -p:DebugType=none -p:Version="$VERSION" -p:AssemblyVersion="$VERSION.0" -p:FileVersion="$VERSION.0" -p:InformationalVersion="$VERSION" \
              -o "artifacts/publish-$rid"
          done

      # The runner is Apple silicon, so the arm64 build draws the icon files both bundles use.
      - name: Draw the icon files
        shell: bash
        run: ./artifacts/publish-osx-arm64/GitAlert --export-png artifacts/pngs

      - name: Bundle, sign and pack
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for rid in osx-arm64 osx-x64; do
            installer/macos/build-app.sh "$VERSION" "$rid" "artifacts/publish-$rid" artifacts/pngs artifacts
          done
          ls -l artifacts/*.dmg

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: artifacts/*.dmg

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Test
        shell: bash
        run: |
          dotnet test tests/GitAlert.Tests/GitAlert.Tests.csproj -c Release
          dotnet test tests/GitAlert.Desktop.Tests/GitAlert.Desktop.Tests.csproj -c Release

      - name: Publish
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet publish src/GitAlert.Desktop/GitAlert.Desktop.csproj -c Release -r linux-x64 --self-contained true \
            -p:DebugType=none -p:Version="$VERSION" -p:AssemblyVersion="$VERSION.0" -p:FileVersion="$VERSION.0" -p:InformationalVersion="$VERSION" \
            -o artifacts/publish-linux-x64

      - name: Draw the icon files
        shell: bash
        run: ./artifacts/publish-linux-x64/GitAlert --export-png artifacts/pngs

      # appimagetool validates the desktop entry with desktop-file-validate and quits without it.
      # The tool itself comes through a script that pins its release and digest.
      - name: Install the packaging tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends desktop-file-utils
          installer/linux/fetch-appimagetool.sh artifacts/appimagetool

      - name: Pack
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          installer/linux/build-packages.sh "$VERSION" artifacts/publish-linux-x64 artifacts/pngs artifacts artifacts/appimagetool
          ls -l artifacts/*.tar.gz artifacts/*.deb artifacts/*.AppImage

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.AppImage

  publish:
    name: Publish the GitHub release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download every package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: packages
          merge-multiple: true

      - name: List packages
        shell: bash
        run: ls -l packages

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: GitAlert ${{ needs.version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: packages/*
          body: |
            ## Install

            **Windows.** Download **GitAlert-Setup-${{ needs.version.outputs.version }}-x64.exe** and run it.
            The installer is per-user, so Windows will not ask for administrator rights. Prefer not to
            install anything? Take the portable `.zip`, unpack it anywhere and run `GitAlert.exe`.
            SmartScreen will warn about an unrecognised publisher: the build is not code signed.
            Choose **More info -> Run anyway**, or check the source and build it yourself.

            **macOS.** Open the `.dmg` for your Mac - `osx-arm64` for Apple silicon, `osx-x64` for
            Intel - and drag GitAlert to Applications. The app is signed ad hoc, not notarised, so the
            first launch is refused: open **System Settings > Privacy & Security**, scroll to the
            message about GitAlert and choose **Open Anyway**. It lives in the menu bar; there is no
            Dock icon.

            **Linux.** The `.deb` installs on Debian and Ubuntu with `sudo apt install ./gitalert_*.deb`;
            the `.AppImage` runs anywhere after `chmod +x`; the `.tar.gz` is the plain folder. GNOME
            needs the AppIndicator extension to show tray icons at all. Tokens go into the desktop's
            secret service when `secret-tool` (libsecret) is installed, and into a file only your
            user can read otherwise - the settings window says which.

            Every build bundles the .NET runtime, so nothing else is required.
