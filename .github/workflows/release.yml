name: Release

# Tag a commit to cut a release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The workflow builds a self-contained x64 build, packages it with Inno Setup and attaches the
# installer and the portable archive to a GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (for example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build installer
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      # The tag name and the dispatch input reach the script through the environment rather than
      # by expression substitution. Substituting them would paste text somebody else chose
      # straight into the shell, and a tag name is allowed to contain quotes.
      - name: Resolve the version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_VERSION
          } else {
            $env:REF_NAME -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a version like 1.0.0, got '$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building GitAlert $version"

      # Pinned like the actions above: a release build should not pick up whatever the package
      # feed happens to hold that day. Dependabot does not watch this one, so bump it by hand.
      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y
        shell: pwsh

      - name: Build, test and package
        shell: pwsh
        run: |
          ./build.ps1 -Version ${{ steps.version.outputs.version }} -Installer -Zip

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem artifacts -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitAlert-${{ steps.version.outputs.version }}
          path: |
            artifacts/GitAlert-Setup-*.exe
            artifacts/GitAlert-*-portable.zip

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: GitAlert ${{ steps.version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/GitAlert-Setup-*.exe
            artifacts/GitAlert-*-portable.zip
          body: |
            ## Install

            Download **GitAlert-Setup-${{ steps.version.outputs.version }}-x64.exe** and run it.
            The installer is per-user, so Windows will not ask for administrator rights, and
            everything lands under your own profile.

            Prefer not to install anything? Take the portable `.zip`, unpack it anywhere and run
            `GitAlert.exe`. Both builds bundle the .NET runtime, so nothing else is required.

            Windows SmartScreen will warn about an unrecognised publisher: the build is not code
            signed. Choose **More info -> Run anyway**, or check the source and build it yourself.
